    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#00191d" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#04343a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#00191d" stop-opacity=".72"/>
    </linearGradient>
  </defs>

